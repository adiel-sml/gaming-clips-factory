[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-clips-factory"
version = "0.1.0"
description = "Transforme des vidéos/streams gaming en clips verticaux prêts pour TikTok, Shorts et Reels"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "typer>=0.12",
  "pyyaml>=6",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "faster-whisper>=1.0",
  "av<16",                  # PyAV 16+ casse faster-whisper 1.2 (paramètre metadata_errors supprimé)
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
url = ["yt-dlp>=2024.1.1"]
llm = ["anthropic>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10"]

[project.scripts]
clips = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests lents (vrai modèle Whisper, rendu complet)",
]
